# --- Configuration Globale ---
app:
  debug: false
  output_dir: "data/output"
  input_dir: "data/input"

# --- Moteur de Règles (Presidio) ---
presidio:
  language: "fr"
  score_threshold: 0.35
  # Entités standard à détecter (Spacy + Presidio Built-in)
  active_entities:
    - "PERSON"
    - "LOCATION"
    - "PHONE_NUMBER"
    - "EMAIL_ADDRESS"
    - "FR_SSN"
    # - "DATE" (Désactivé car géré par le LLM)

  # Règles personnalisées (Regex)
  custom_rules:
    - name: "CodePostalFrance"
      entity_type: "LOCATION"
      regex: "\\b\\d{5}\\b"
      score: 0.5

    - name: "VoirieFrance"
      entity_type: "LOCATION"
      regex: "(?i)\\b(rue|avenue|av\\.|boulevard|bd|impasse|allée|quai|place|route|chemin)\\s+([a-zA-Z0-9\\s\\-\\']+)"
      score: 0.6

# --- Moteur Intelligent (LLM) ---
llm:
  model_fallback: "gpt-oss:20b" # ou mistral
  timeout_sec: 300

  # LE NOUVEAU PROMPT JUGE
  judge_prompt: |
    RÔLE : Moteur de filtrage de sécurité.
    
    ENTRÉE :
    1. Texte de référence.
    2. Liste de "Candidats" (suspicions de données personnelles).
    
    TÂCHE :
    Filtrer la liste des candidats et renvoyer UNIQUEMENT ceux qui sont réellement sensibles et doivent être masqués (REDACT).
    
    CRITÈRES DE MASQUAGE (REDACT) :
    - Noms de personnes réels.
    - Adresses complètes ou lieux précis (ex: "Hôpital St Louis" -> REDACT, "Paris" -> IGNORER).
    - Dates de naissance précises (IGNORER les années seules).
    - Identifiants (SSN, Email, Tel).
    - CORRECTIONS : Si un candidat coupe une adresse (ex: "Rue X"), renvoie la version complète ("10 Rue X").
    
    SORTIE JSON STRICTE :
    {{
      "redactions": [
         {{ "text": "M. Dupont", "type": "PERSON" }},
         {{ "text": "39 Rue Bobillot", "type": "ADDRESS_FULL" }}
      ]
    }}
    
    IMPORTANT :
    - Ne renvoie PAS les candidats à garder (KEEP). Ignore-les simplement.
    - Si aucun candidat n'est sensible, renvoie {{ "redactions": [] }}.
    - Pas de blabla, juste le JSON.
    
    ---
    Candidats : {candidate_list_json}
    
    Texte : 
    """{page_text}"""