# --- Configuration Globale ---
app:
  debug: false
  output_dir: "data/output"
  input_dir: "data/input"

# --- Moteur de Règles (Presidio) ---
presidio:
  language: "fr"
  score_threshold: 0.35
  # Entités standard à détecter (Spacy + Presidio Built-in)
  active_entities:
    - "PERSON"
    - "LOCATION"
    - "PHONE_NUMBER"
    - "EMAIL_ADDRESS"
    - "FR_SSN"
    - "DATE"
    - "NRP"

  # Règles personnalisées (Regex) qui passent AVANT le LLM
  custom_rules:
    # 1. Regex Téléphone France (Points, Espaces, Tirets)
    - name: "TelFrance"
      entity_type: "PHONE_NUMBER"
      # Capture 01.02.03.04.05 ou 01 02 03 04 05 ou +33 1...
      regex: "(?:(?:\\+|00)33|0)\\s*[1-9](?:[\\s.-]*\\d{2}){4}"
      score: 1.0

    # 2. Dates — masquées d'office, AVANT le LLM.
    #    ATTENTION : entity_type doit être "DATE", comme dans active_entities. L'ancienne règle
    #    déclarait "DATE_TIME" : Presidio ne la sortait jamais, toutes les dates reposaient sur le LLM.
    #    (Ne pas activer "DATE_TIME" : ce serait le NER de spaCy, qui masque « 2024 », « 3 semaines »...)
    #    POLITIQUE : années seules (« 2017 ») et mois + année (« mars 2024 », « 05/2025 ») NE sont PAS masqués.

    # 2a. Date complète : 28/07/1965, 28-07-1965, 28.07.1965, 5/02/25 (même séparateur des deux côtés).
    #     Jour 1-31, mois 1-12. Les bornes évitent de mordre dans un téléphone (01.02.03.04.05).
    - name: "DateComplete"
      entity_type: "DATE"
      regex: "(?<![\\d/.-])(?:0?[1-9]|[12]\\d|3[01])([/.-])(?:0?[1-9]|1[0-2])\\1(?:(?:19|20)\\d{2}|\\d{2})(?!\\d|[/.-]\\d)"
      score: 1.0

    # 2b. Date sans année : 13/05, 2/06. Le mois doit avoir DEUX chiffres : écarte « TA 12/8 », « 3/4 », « 1/2 ».
    #     Écarte aussi les scores (« EN 8/10 », « EVA 3/10 », « cotée à 18/30 ») et les doses (« 20/10 mg »).
    #     Limite connue : « Liptruzet 20/10 » sans unité passe pour un 20 octobre.
    - name: "DateSansAnnee"
      entity_type: "DATE"
      regex: "(?<![\\d/.,-])(?<!\\bEN )(?<!EVA )(?<!à )(?:0?[1-9]|[12]\\d|3[01])/(?:0[1-9]|1[0-2])(?![\\d/]|[.,]\\d|\\s?(?:mg|µg|mmHg|ml|%))"
      score: 0.8

    # 2c. Date en lettres : « 12 mars 2024 », « 1er avril », « du 3 au 6 mars ». Un JOUR est exigé :
    #     « mars 2024 » seul ne correspond pas (politique ci-dessus).
    - name: "DateEnLettres"
      entity_type: "DATE"
      regex: "(?<![\\d/])(?:(?:1er|\\d{1,2})\\s+au\\s+)?(?:1er|0?[1-9]|[12]\\d|3[01])\\s+(?:janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)(?:\\s+(?:19|20)\\d{2})?\\b"
      score: 1.0

    # 3. Regex Codes Postaux
    - name: "CodePostalFrance"
      entity_type: "LOCATION"
      regex: "\\b\\d{5}\\b"
      score: 0.5

    # 4. Regex Rues classiques
    - name: "VoirieFrance"
      entity_type: "LOCATION"
      regex: "(?i)\\b(rue|avenue|av\\.|boulevard|bd|impasse|allée|quai|place|route|chemin)\\s+([a-zA-Z0-9\\s\\-\\']+)"
      score: 0.6

# --- Moteur Intelligent (LLM) ---
# ... (début du fichier inchangé)

llm:
  model_fallback: "gpt-oss:20b"
  timeout_sec: 300
  # Température de l'appel (celle d'origine). Une réponse tronquée est retentée UNE fois à 0.
  temperature: 0.6
  # Plafond de longueur PAR RÉPONSE, en jetons. Avant : -1 (infini) — une pensée ou une boucle de
  # répétition tournait jusqu'au bout du contexte (constat du 05/10/2026 : 3 000 à 4 096 jetons,
  # 2 min 15 à 2 min 25 par appel, contenu VIDE, 0 terme, nom en clair). Mesuré sur Gemma 4 12B
  # sans pensée : une réponse légitime fait 13 à 196 jetons sur 8 documents synthétiques, et 440
  # sur un bloc de 3 000 caractères saturé de noms (30 personnes, 67 identifiants) — soit ~590
  # extrapolés au bloc maximal de 4 000 caractères. 1024 laisse ~1,7 fois cette marge et borne un
  # appel fou à ~45 s (à ~22 jetons/s au bureau). Si une réponse bute dessus : nouvel essai à
  # température 0, puis échec franc du document (jamais une liste partielle). Une page plus dense
  # encore qui échouerait ainsi se règle en montant cette valeur, pas en la retirant.
  num_predict: 1024

  # NOUVEAU PROMPT : Stratégie Few-Shot (Liste simple)
  # Les accolades doubles {{ }} servent à échapper les accolades pour Python .format()
  judge_prompt: |
    RÔLE : Expert en anonymisation médicale (RGPD).
    
    TA MISSION : Identifier dans le TEXTE ORIGINAL TOUTES les données sensibles à masquer.
    La liste "CANDIDATS" n'est qu'une AMORCE produite par un détecteur automatique : elle est INCOMPLÈTE (il lui manque des noms) et contient des ERREURS (médicaments, maladies, échelles). Sers-t'en comme d'exemples du type d'information à traquer : écarte ses erreurs, et AJOUTE tout ce qu'elle a raté. Lis le texte en entier, pas seulement la liste.
    
    RÈGLES DE DÉCISION :
    1. MASQUER : Noms de famille, Prénoms, Adresses complètes, Noms d'hôpitaux précis, Dates de naissance, Dates précises, Téléphone, Noms de Villes.
    2. IGNORER : Départements, Noms de médicaments, Termes médicaux, Mois et années seules.
    3. FORMAT : Renvoie une liste brute, un terme par ligne, des termes à MASQUER. Pas de JSON, pas de markdown, pas de tirets.
    
    ---
    EXEMPLE 1 :
    TEXTE : "M. Dupont Jean est venu à l'Hôpital Nord."
    CANDIDATS : ["Dr Dupont Jean", "Nord", "Hôpital"]
    RÉPONSE ATTENDUE :
    Dupont Jean
    Hôpital Nord
    
    EXEMPLE 2 (Correction) :
    TEXTE : "Il habite 10 rue de la Paix."
    CANDIDATS : ["rue de la Paix"]
    RÉPONSE ATTENDUE :
    10 rue de la Paix
    
    EXEMPLE 3 (Médecin) :
    TEXTE : "Examen réalisé par le Dr Jean Dupont."
    RÉPONSE :
    Jean Dupont
    Dr Jean Dupont
    Dupont
    
    EXEMPLE 4 (Téléphone) :
    TEXTE : "09.72.13.01.07"
    RÉPONSE : 
    0972130107
    09.72.13.01.07
    09 72 13 01 07.
    
    EXEMPLE 5 (Amorce incomplète et fausse) :
    TEXTE : "Mme Leroy, suivie pour un Parkinson, est adressée par le Dr Klein de Colmar."
    CANDIDATS : ["Parkinson", "Colmar"]
    RÉPONSE ATTENDUE :
    Leroy
    Klein
    Dr Klein
    Colmar

    ---
    CAS RÉEL À TRAITER :

    TEXTE ORIGINAL :
    {page_text}

    CANDIDATS (amorce incomplète : à vérifier ET à compléter) :
    {candidates_str}

    TA LISTE FINALE (Un terme par ligne) :

  # PROMPT MÉTIERS (option --metiers, mode texte seulement) : PAS un masquage, une généralisation.
  # Politique de hedrox : garder le métier est utile (ce sont souvent des expertises), seuls les
  # métiers RARES ou rendus identifiants par un lieu/une institution doivent être généralisés.
  metiers_prompt: |
    RÔLE : Expert en anonymisation médicale (RGPD), spécialisé sur les MÉTIERS.

    TA MISSION : dans le TEXTE ci-dessous, repère les métiers ou fonctions qui, tels quels,
    permettraient d'identifier la personne — parce qu'ils sont RARES (peu de gens les exercent)
    ou rendus identifiants par un LIEU ou une INSTITUTION précise qui les accompagne. Pour
    chacun, propose une GÉNÉRALISATION qui garde le champ professionnel sans permettre de
    retrouver la personne.

    NE TOUCHE PAS aux métiers COURANTS, même écrits seuls sans lieu ni institution : retraité,
    enseignant, infirmière, ouvrier, magasinier, informaticien, secrétaire, agriculteur,
    commerçant, comptable, gestionnaire, caissière, couturière, dentiste, médecin, avocat,
    ingénieur (y compris "ingénieur informatique")... La médecine et les professions
    réglementées classiques sont COURANTES : ne les touche jamais, un métier rare n'est pas
    un métier qui sonne technique.

    NE TOUCHE JAMAIS un nom de personne ni un titre de civilité (Dr, Pr, M., Mme...) : ce n'est
    pas ton rôle, un autre outil s'en charge déjà. Si un métier est accolé à un nom (« Dr Untel,
    cardiologue »), ne rends QUE le métier isolé s'il est rare — jamais le nom ni le titre.

    FORMAT : une ligne par métier à généraliser, exactement :
    terme exact du texte => généralisation
    Recopie le terme EXACTEMENT comme il apparaît dans le texte (mêmes mots, même casse), et
    UNIQUEMENT le métier — jamais un nom propre, jamais une civilité.
    Si aucun métier ne doit être généralisé, ne réponds RIEN.

    ---
    EXEMPLE 1 (métier rare) :
    TEXTE : "Profession : facteur d'orgues, il répare les instruments anciens de la région."
    RÉPONSE :
    facteur d'orgues => artisan

    EXEMPLE 2 (métier rendu identifiant par l'institution) :
    TEXTE : "Elle est sonneuse de carillon à la cathédrale de Toul depuis quinze ans."
    RÉPONSE :
    sonneuse de carillon à la cathédrale de Toul => employée d'un lieu de culte

    EXEMPLE 3 (métier courant, même technique : RIEN à faire) :
    TEXTE : "Il est magasinier dans un entrepôt logistique près de Metz. Monsieur Petit est dentiste en activité."
    RÉPONSE :
    (rien)

    EXEMPLE 4 (fonction identifiante par le lieu) :
    TEXTE : "Son père est maire de Vandœuvre-lès-Nancy depuis 2014."
    RÉPONSE :
    maire de Vandœuvre-lès-Nancy => élu local

    EXEMPLE 5 (métier accolé à un nom : ne toucher QUE le métier s'il est rare, et seulement
    s'il est rare — ici "cardiologue" est courant, donc RIEN à faire) :
    TEXTE : "Signataire : Dr Vitaly Rajchert, cardiologue."
    RÉPONSE :
    (rien)

    ---
    TEXTE :
    {page_text}

    TA RÉPONSE (un terme par ligne, "terme exact => généralisation", ou rien) :