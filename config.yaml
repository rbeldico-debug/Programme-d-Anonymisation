# --- Configuration Globale ---
app:
  debug: false
  output_dir: "data/output"
  input_dir: "data/input"

# --- Moteur de Règles (Presidio) ---
presidio:
  language: "fr"
  score_threshold: 0.35
  # Entités standard à détecter (Spacy + Presidio Built-in)
  active_entities:
    - "PERSON"
    - "LOCATION"
    - "PHONE_NUMBER"
    - "EMAIL_ADDRESS"
    - "FR_SSN"
    - "DATE"
    - "NRP"

  # Règles personnalisées (Regex) qui passent AVANT le LLM
  custom_rules:
    # 1. Regex Téléphone France (Points, Espaces, Tirets)
    - name: "TelFrance"
      entity_type: "PHONE_NUMBER"
      # Capture 01.02.03.04.05 ou 01 02 03 04 05 ou +33 1...
      regex: "(?:(?:\\+|00)33|0)\\s*[1-9](?:[\\s.-]*\\d{2}){4}"
      score: 1.0

    # 2. Dates — masquées d'office, AVANT le LLM.
    #    ATTENTION : entity_type doit être "DATE", comme dans active_entities. L'ancienne règle
    #    déclarait "DATE_TIME" : Presidio ne la sortait jamais, toutes les dates reposaient sur le LLM.
    #    (Ne pas activer "DATE_TIME" : ce serait le NER de spaCy, qui masque « 2024 », « 3 semaines »...)
    #    POLITIQUE : années seules (« 2017 ») et mois + année (« mars 2024 », « 05/2025 ») NE sont PAS masqués.

    # 2a. Date complète : 28/07/1965, 28-07-1965, 28.07.1965, 5/02/25 (même séparateur des deux côtés).
    #     Jour 1-31, mois 1-12. Les bornes évitent de mordre dans un téléphone (01.02.03.04.05).
    - name: "DateComplete"
      entity_type: "DATE"
      regex: "(?<![\\d/.-])(?:0?[1-9]|[12]\\d|3[01])([/.-])(?:0?[1-9]|1[0-2])\\1(?:(?:19|20)\\d{2}|\\d{2})(?!\\d|[/.-]\\d)"
      score: 1.0

    # 2b. Date sans année : 13/05, 2/06. Le mois doit avoir DEUX chiffres : écarte « TA 12/8 », « 3/4 », « 1/2 ».
    #     Écarte aussi les scores (« EN 8/10 », « EVA 3/10 », « cotée à 18/30 ») et les doses (« 20/10 mg »).
    #     Limite connue : « Liptruzet 20/10 » sans unité passe pour un 20 octobre.
    - name: "DateSansAnnee"
      entity_type: "DATE"
      regex: "(?<![\\d/.,-])(?<!\\bEN )(?<!EVA )(?<!à )(?:0?[1-9]|[12]\\d|3[01])/(?:0[1-9]|1[0-2])(?![\\d/]|[.,]\\d|\\s?(?:mg|µg|mmHg|ml|%))"
      score: 0.8

    # 2c. Date en lettres : « 12 mars 2024 », « 1er avril », « du 3 au 6 mars ». Un JOUR est exigé :
    #     « mars 2024 » seul ne correspond pas (politique ci-dessus).
    - name: "DateEnLettres"
      entity_type: "DATE"
      regex: "(?<![\\d/])(?:(?:1er|\\d{1,2})\\s+au\\s+)?(?:1er|0?[1-9]|[12]\\d|3[01])\\s+(?:janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)(?:\\s+(?:19|20)\\d{2})?\\b"
      score: 1.0

    # 3. Regex Codes Postaux
    - name: "CodePostalFrance"
      entity_type: "LOCATION"
      regex: "\\b\\d{5}\\b"
      score: 0.5

    # 4. Regex Rues classiques
    - name: "VoirieFrance"
      entity_type: "LOCATION"
      regex: "(?i)\\b(rue|avenue|av\\.|boulevard|bd|impasse|allée|quai|place|route|chemin)\\s+([a-zA-Z0-9\\s\\-\\']+)"
      score: 0.6

# --- Moteur Intelligent (LLM) ---
# ... (début du fichier inchangé)

llm:
  model_fallback: "gpt-oss:20b"
  timeout_sec: 300

  # NOUVEAU PROMPT : Stratégie Few-Shot (Liste simple)
  # Les accolades doubles {{ }} servent à échapper les accolades pour Python .format()
  judge_prompt: |
    RÔLE : Expert en anonymisation médicale (RGPD).
    
    TA MISSION : Identifier dans le TEXTE ORIGINAL TOUTES les données sensibles à masquer.
    La liste "CANDIDATS" n'est qu'une AMORCE produite par un détecteur automatique : elle est INCOMPLÈTE (il lui manque des noms) et contient des ERREURS (médicaments, maladies, échelles). Sers-t'en comme d'exemples du type d'information à traquer : écarte ses erreurs, et AJOUTE tout ce qu'elle a raté. Lis le texte en entier, pas seulement la liste.
    
    RÈGLES DE DÉCISION :
    1. MASQUER : Noms de famille, Prénoms, Adresses complètes, Noms d'hôpitaux précis, Dates de naissance, Dates précises, Téléphone, Noms de Villes.
    2. IGNORER : Départements, Noms de médicaments, Termes médicaux, Mois et années seules.
    3. FORMAT : Renvoie une liste brute, un terme par ligne, des termes à MASQUER. Pas de JSON, pas de markdown, pas de tirets.
    
    ---
    EXEMPLE 1 :
    TEXTE : "M. Dupont Jean est venu à l'Hôpital Nord."
    CANDIDATS : ["Dr Dupont Jean", "Nord", "Hôpital"]
    RÉPONSE ATTENDUE :
    Dupont Jean
    Hôpital Nord
    
    EXEMPLE 2 (Correction) :
    TEXTE : "Il habite 10 rue de la Paix."
    CANDIDATS : ["rue de la Paix"]
    RÉPONSE ATTENDUE :
    10 rue de la Paix
    
    EXEMPLE 3 (Médecin) :
    TEXTE : "Examen réalisé par le Dr Jean Dupont."
    RÉPONSE :
    Jean Dupont
    Dr Jean Dupont
    Dupont
    
    EXEMPLE 4 (Téléphone) :
    TEXTE : "09.72.13.01.07"
    RÉPONSE : 
    0972130107
    09.72.13.01.07
    09 72 13 01 07.
    
    EXEMPLE 5 (Amorce incomplète et fausse) :
    TEXTE : "Mme Leroy, suivie pour un Parkinson, est adressée par le Dr Klein de Colmar."
    CANDIDATS : ["Parkinson", "Colmar"]
    RÉPONSE ATTENDUE :
    Leroy
    Klein
    Dr Klein
    Colmar

    ---
    CAS RÉEL À TRAITER :
    
    TEXTE ORIGINAL :
    {page_text}
    
    CANDIDATS (amorce incomplète : à vérifier ET à compléter) :
    {candidates_str}
    
    TA LISTE FINALE (Un terme par ligne) :